<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Live Scoreboard</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 40px;

}


h1 {

    text-align: center;

    font-size: 60px;

    margin: 0 0 45px;

    letter-spacing: 3px;

}


#scoreboard {

    width: 90%;

    max-width: 1400px;

    margin: auto;

}


.row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 28px 45px;

    margin-bottom: 20px;

    border-radius: 22px;

    font-size: 38px;

    font-weight: bold;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.5);

}


.left {

    display: flex;

    align-items: center;

    gap: 40px;

}


.position {

    min-width: 170px;

}


.score {

    font-size: 58px;

    min-width: 130px;

    text-align: right;

}


.red {
    background: #c62828;
}

.blue {
    background: #1565c0;
}

.green {
    background: #2e7d32;
}

.yellow {

    background: #d99a00;

    color: #111;

}


.first {

    box-shadow:
        0 0 30px
        rgba(255,255,255,0.35),
        0 10px 35px
        rgba(0,0,0,0.6);

}


.status {

    position: fixed;

    bottom: 15px;

    right: 20px;

    color: #777;

    font-size: 14px;

}


/* Fullscreen */

.fullscreen {

    position: fixed;

    top: 20px;

    left: 20px;

    padding: 10px 16px;

    background: rgba(255,255,255,0.1);

    border: 1px solid
        rgba(255,255,255,0.2);

    color: white;

    border-radius: 8px;

    cursor: pointer;

}


@media (max-width: 900px) {

    h1 {
        font-size: 40px;
    }

    .row {
        font-size: 25px;
        padding: 20px;
    }

    .score {
        font-size: 40px;
    }

}

</style>

</head>


<body>


<button
    class="fullscreen"
    onclick="goFullscreen()">

    ⛶ Fullscreen

</button>


<h1>
    🏆 SCOREBOARD
</h1>


<div id="scoreboard"></div>


<div class="status" id="status">
    Connecting...
</div>


<script type="module">


import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
    apiKey: "AIzaSyDxBocH0sFka2EqYb0IOD6Js_DOAj0GNB4",
    authDomain: "game-scoreboard-da018.firebaseapp.com",
    databaseURL: "https://game-scoreboard-da018-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "game-scoreboard-da018",
    storageBucket: "game-scoreboard-da018.firebasestorage.app",
    messagingSenderId: "678666747725",
    appId: "1:678666747725:web:cde8be983c94db2e3ec104"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const scoreboardRef =
    ref(db, "scoreboard");


/* ==============================
   TEAMS
============================== */

const teams = [

    {
        id: "red",
        name: "RED",
        emoji: "🔴",
        className: "red"
    },

    {
        id: "blue",
        name: "BLUE",
        emoji: "🔵",
        className: "blue"
    },

    {
        id: "green",
        name: "GREEN",
        emoji: "🟢",
        className: "green"
    },

    {
        id: "yellow",
        name: "YELLOW",
        emoji: "🟡",
        className: "yellow"
    }

];


/* ==============================
   FIREBASE LIVE LISTENER
============================== */

onValue(

    scoreboardRef,

    snapshot => {

        const data =
            snapshot.val() || {};

        updateProjector(data);


        document.getElementById(
            "status"
        ).textContent =
            "🟢 LIVE";

    }

);


/* ==============================
   UPDATE PROJECTOR
============================== */

function updateProjector(data) {

    const results = [];


    teams.forEach(team => {

        const teamData =
            data[team.id] || {};


        let total = 0;


        for (
            let round = 1;
            round <= 4;
            round++
        ) {

            total +=
                Number(
                    teamData[
                        `round${round}`
                    ]
                ) || 0;

        }


        results.push({

            ...team,

            total

        });

    });


    /* Highest score first */

    results.sort(
        (a, b) =>
            b.total - a.total
    );


    /* Handle ties */

    const uniqueScores =
        [...new Set(
            results.map(
                team => team.total
            )
        )];


    const container =
        document.getElementById(
            "scoreboard"
        );


    container.innerHTML = "";


    results.forEach(team => {

        const position =
            uniqueScores.indexOf(
                team.total
            ) + 1;


        let positionText;


        if (position === 1)
            positionText = "👑 1ST";

        else if (position === 2)
            positionText = "🥈 2ND";

        else if (position === 3)
            positionText = "🥉 3RD";

        else
            positionText = "4TH";


        const row =
            document.createElement("div");


        row.className =
            `row ${team.className}`;


        if (position === 1) {

            row.classList.add(
                "first"
            );

        }


        row.innerHTML = `

            <div class="left">

                <div class="position">
                    ${positionText}
                </div>

                <div>
                    ${team.emoji}
                    ${team.name}
                </div>

            </div>


            <div class="score">
                ${team.total}
            </div>

        `;


        container.appendChild(row);

    });

}


/* ==============================
   FULLSCREEN
============================== */

function goFullscreen() {

    document.documentElement
        .requestFullscreen();

}

</script>

</body>
</html>
