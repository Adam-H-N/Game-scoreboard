<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Controller</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #111;
        color: white;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 32px;
    }

    .status {
        text-align: center;
        margin-bottom: 20px;
        font-size: 16px;
        color: #00ff88;
    }

    .teams {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        max-width: 900px;
        margin: auto;
    }

    .team-card {
        border-radius: 20px;
        padding: 20px;
        color: white;
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .red {
        background: linear-gradient(135deg, #ff1744, #9b001f);
    }

    .blue {
        background: linear-gradient(135deg, #2979ff, #003c9e);
    }

    .green {
        background: linear-gradient(135deg, #00c853, #006b2c);
    }

    .yellow {
        background: linear-gradient(135deg, #ffd600, #a87900);
        color: #111;
    }

    .team-name {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 15px;
    }

    .rounds {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    .round {
        text-align: center;
    }

    .round label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .score-input {
        width: 100%;
        height: 55px;
        border: none;
        border-radius: 12px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        outline: none;
    }

    .total {
        text-align: center;
        margin-top: 15px;
        font-size: 24px;
        font-weight: bold;
    }

    .ranking {
        max-width: 900px;
        margin: 30px auto;
        background: #1c1c1c;
        padding: 20px;
        border-radius: 20px;
    }

    .ranking h2 {
        text-align: center;
        margin-bottom: 15px;
    }

    .rank-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #292929;
        padding: 15px 20px;
        margin: 8px 0;
        border-radius: 12px;
        font-size: 20px;
    }

    .rank-team {
        font-weight: bold;
    }

    .rank-score {
        font-weight: bold;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 15px 25px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .reset-btn {
        background: #ff1744;
        color: white;
    }

    .reset-btn:active {
        transform: scale(0.96);
    }

    .projector-btn {
        background: #00c853;
        color: white;
    }

    @media (max-width: 650px) {
        body {
            padding: 10px;
        }

        h1 {
            font-size: 26px;
        }

        .teams {
            grid-template-columns: 1fr;
        }

        .team-name {
            font-size: 25px;
        }

        .score-input {
            height: 60px;
            font-size: 24px;
        }

        .ranking {
            margin-top: 20px;
        }
    }
</style>
</head>

<body>

<h1>🏆 Score Controller</h1>

<div class="status" id="status">
    🟢 Connected to Firebase
</div>

<div class="teams" id="teamsContainer"></div>

<div class="ranking">
    <h2>🏆 Current Ranking</h2>
    <div id="rankingList"></div>
</div>

<div class="controls">

    <button class="reset-btn" onclick="resetScores()">
        🔄 RESET SCORES
    </button>

    <button class="projector-btn" onclick="openProjector()">
        📺 OPEN PROJECTOR
    </button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    set
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


// ===============================
// FIREBASE CONFIG
// ===============================

const firebaseConfig = {

    apiKey: "AIzaSyDxBocH0Fka2EqYb0IOD6Js_DOAj0GNB4",

    authDomain:
        "game-scoreboard-da018.firebaseapp.com",

    databaseURL:
        "https://game-scoreboard-da018-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "game-scoreboard-da018",

    storageBucket:
        "game-scoreboard-da018.firebasestorage.app",

    messagingSenderId:
        "678666747725",

    appId:
        "1:678666747725:web:cde8be983c94db2e3ec104"
};


// ===============================
// INITIALIZE FIREBASE
// ===============================

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const scoreboardRef = ref(db, "scoreboard");


// ===============================
// TEAMS
// ===============================

const teams = [

    {
        id: "red",
        name: "RED",
        emoji: "🔴",
        className: "red"
    },

    {
        id: "blue",
        name: "BLUE",
        emoji: "🔵",
        className: "blue"
    },

    {
        id: "green",
        name: "GREEN",
        emoji: "🟢",
        className: "green"
    },

    {
        id: "yellow",
        name: "YELLOW",
        emoji: "🟡",
        className: "yellow"
    }

];


// ===============================
// CREATE TEAM UI
// ===============================

const teamsContainer =
    document.getElementById("teamsContainer");


teams.forEach(team => {

    const card = document.createElement("div");

    card.className =
        `team-card ${team.className}`;

    card.innerHTML = `

        <div class="team-name">
            ${team.emoji} ${team.name}
        </div>

        <div class="rounds">

            ${createRound(team.id, 1)}
            ${createRound(team.id, 2)}
            ${createRound(team.id, 3)}
            ${createRound(team.id, 4)}

        </div>

        <div class="total">
            TOTAL:
            <span id="${team.id}-total">0</span>
        </div>

    `;

    teamsContainer.appendChild(card);

});


// ===============================
// CREATE ROUND INPUT
// ===============================

function createRound(team, round) {

    return `

        <div class="round">

            <label>R${round}</label>

            <input
                class="score-input"
                type="number"
                min="0"
                inputmode="numeric"
                id="${team}-round${round}"
                data-team="${team}"
                data-round="${round}"
            >

        </div>

    `;

}


// ===============================
// SCORE INPUT LISTENERS
// ===============================

document
    .querySelectorAll(".score-input")
    .forEach(input => {

        input.addEventListener("input", async function() {

            const team =
                this.dataset.team;

            const round =
                this.dataset.round;

            let value =
                this.value.trim();

            // Blank = 0 in Firebase
            let score =
                value === ""
                    ? 0
                    : Number(value);

            if (score < 0 || isNaN(score)) {
                score = 0;
            }

            try {

                await update(

                    ref(
                        db,
                        `scoreboard/${team}`
                    ),

                    {
                        [`round${round}`]: score
                    }

                );

            } catch(error) {

                console.error(
                    "Score update failed:",
                    error
                );

                document.getElementById("status")
                    .textContent =
                    "🔴 Firebase error";

            }

        });

    });


// ===============================
// LIVE FIREBASE LISTENER
// ===============================

onValue(
    scoreboardRef,
    snapshot => {

        const data =
            snapshot.val() || {};

        let ranking = [];


        teams.forEach(team => {

            const teamData =
                data[team.id] || {};

            let total = 0;


            for (
                let round = 1;
                round <= 4;
                round++
            ) {

                const input =
                    document.getElementById(
                        `${team.id}-round${round}`
                    );


                const score =
                    Number(
                        teamData[`round${round}`] || 0
                    );


                total += score;


                /*
                 Don't overwrite the input
                 while the user is typing.
                */

                if (
                    document.activeElement !== input
                ) {

                    if (
                        teamData[`round${round}`] === undefined ||
                        teamData[`round${round}`] === null ||
                        teamData[`round${round}`] === 0
                    ) {

                        input.value = "";

                    } else {

                        input.value =
                            teamData[`round${round}`];

                    }

                }

            }


            document.getElementById(
                `${team.id}-total`
            ).textContent = total;


            ranking.push({

                id: team.id,

                name: team.name,

                emoji: team.emoji,

                total: total

            });

        });


        updateRanking(ranking);

        document.getElementById("status")
            .textContent =
            "🟢 LIVE — Firebase connected";

    },

    error => {

        console.error(error);

        document.getElementById("status")
            .textContent =
            "🔴 Firebase connection error";

    }
);


// ===============================
// RANKING
// ===============================

function updateRanking(ranking) {

    ranking.sort(
        (a, b) => b.total - a.total
    );


    const rankingList =
        document.getElementById(
            "rankingList"
        );


    rankingList.innerHTML = "";


    let previousScore = null;

    let position = 0;

    let actualPosition = 0;


    ranking.forEach((team, index) => {

        actualPosition++;


        if (
            team.total !== previousScore
        ) {

            position =
                actualPosition;

        }


        previousScore =
            team.total;


        let positionText;


        if (position === 1) {

            positionText =
                "👑 1ST";

        }
        else if (position === 2) {

            positionText =
                "🥈 2ND";

        }
        else if (position === 3) {

            positionText =
                "🥉 3RD";

        }
        else {

            positionText =
                `${position}TH`;

        }


        const row =
            document.createElement("div");


        row.className =
            "rank-row";


        row.innerHTML = `

            <div class="rank-team">

                ${positionText}
                &nbsp;&nbsp;
                ${team.emoji}
                ${team.name}

            </div>

            <div class="rank-score">

                ${team.total}

            </div>

        `;


        rankingList.appendChild(row);

    });

}


// ===============================
// RESET SCORES
// ===============================

window.resetScores = async function() {

    const confirmed =
        confirm(
            "Are you sure you want to reset ALL scores?"
        );


    if (!confirmed) {
        return;
    }


    const emptyScores = {

        red: {
            round1: 0,
            round2: 0,
            round3: 0,
            round4: 0
        },

        blue: {
            round1: 0,
            round2: 0,
            round3: 0,
            round4: 0
        },

        green: {
            round1: 0,
            round2: 0,
            round3: 0,
            round4: 0
        },

        yellow: {
            round1: 0,
            round2: 0,
            round3: 0,
            round4: 0
        }

    };


    try {

        /*
         * THIS writes directly to Firebase.
         * Both controller and projector
         * will receive the reset.
         */

        await set(
            scoreboardRef,
            emptyScores
        );


        /*
         * Immediately clear the visible inputs.
         */

        document
            .querySelectorAll(".score-input")
            .forEach(input => {

                input.value = "";

            });


        document
            .querySelectorAll(".total")
            .forEach(total => {

                const number =
                    total.querySelector("span");

                if (number) {
                    number.textContent = "0";
                }

            });


        document.getElementById("status")
            .textContent =
            "🟢 SCORES RESET";


    } catch(error) {

        console.error(
            "RESET ERROR:",
            error
        );


        document.getElementById("status")
            .textContent =
            "🔴 RESET FAILED";


        alert(
            "Reset failed!\n\n" +
            error.message
        );

    }

};


// ===============================
// OPEN PROJECTOR
// ===============================

window.openProjector = function() {

    window.open(
        "projector.html",
        "_blank"
    );

};

</script>

</body>
</html>
